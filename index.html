<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema Experto: Marketing Digital (Prolog)</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #38bdf8;
      --primary-hover: #0284c7;
      --border: #334155;
      --bubble-bot: #1e293b;
      --bubble-user: #0369a1;
      --bubble-why: #854d0e;
      --badge-success: #166534;
      --badge-alert: #991b1b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }

    .chat-container {
      width: 100%;
      max-width: 900px;
      height: 92vh;
      background-color: #111827;
      border: 1px solid var(--border);
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
      overflow: hidden;
    }

    /* Header */
    .chat-header {
      padding: 16px 20px;
      background-color: #1f2937;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .chat-header h1 {
      font-size: 1.15rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .chat-header .badge {
      background-color: #0284c7;
      font-size: 0.72rem;
      padding: 3px 8px;
      border-radius: 9999px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .btn-reset {
      background-color: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 6px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.85rem;
      transition: all 0.2s;
    }

    .btn-reset:hover {
      background-color: #374151;
      color: #fff;
    }

    /* Messages Area */
    .chat-messages {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .msg {
      max-width: 82%;
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 0.95rem;
      line-height: 1.5;
      animation: fadeIn 0.25s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .msg-bot {
      align-self: flex-start;
      background-color: var(--bubble-bot);
      border: 1px solid var(--border);
      color: var(--text);
    }

    .msg-user {
      align-self: flex-end;
      background-color: var(--bubble-user);
      color: white;
    }

    .msg-why {
      align-self: flex-start;
      background-color: var(--bubble-why);
      border: 1px solid #a16207;
      color: #fef08a;
      font-size: 0.88rem;
    }

    .msg-result {
      width: 100%;
      max-width: 100%;
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
      border: 2px solid var(--primary);
      border-radius: 12px;
      padding: 18px;
      margin-top: 8px;
    }

    .msg-result h2 {
      color: var(--primary);
      margin-bottom: 6px;
      font-size: 1.35rem;
    }

    .score-pill {
      display: inline-block;
      background-color: var(--badge-success);
      color: #bbf7d0;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.85rem;
      margin-bottom: 10px;
    }

    .how-section {
      margin-top: 16px;
      border-top: 1px solid var(--border);
      padding-top: 12px;
      font-size: 0.85rem;
    }

    .how-list {
      list-style: none;
      margin-top: 6px;
    }

    .how-list li {
      margin-bottom: 4px;
      display: flex;
      align-items: flex-start;
      gap: 6px;
    }

    .check { color: #4ade80; font-weight: bold; }
    .cross { color: #f87171; font-weight: bold; }

    /* Controls Area */
    .chat-controls {
      padding: 14px 20px;
      background-color: #1f2937;
      border-top: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .quick-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .btn-action {
      flex: 1 1 auto;
      min-width: 110px;
      padding: 10px 14px;
      border: none;
      border-radius: 8px;
      font-size: 0.92rem;
      font-weight: 500;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s;
    }

    .btn-action:active {
      transform: scale(0.98);
    }

    .btn-opt {
      background-color: #1e3a8a;
      color: #e0e7ff;
      border: 1px solid #3b82f6;
    }
    .btn-opt:hover { background-color: #2563eb; color: #fff; }

    .btn-yes {
      background-color: #15803d;
      color: white;
    }
    .btn-yes:hover { background-color: #16a34a; }

    .btn-no {
      background-color: #b91c1c;
      color: white;
    }
    .btn-no:hover { background-color: #dc2626; }

    .btn-why {
      background-color: #b45309;
      color: white;
      min-width: 110px;
    }
    .btn-why:hover { background-color: #d97706; }

    .input-form {
      display: flex;
      gap: 10px;
    }

    .input-form input {
      flex: 1;
      padding: 10px 16px;
      background-color: #111827;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
    }

    .input-form input:focus {
      border-color: var(--primary);
    }

    .btn-send {
      background-color: var(--primary);
      color: #0f172a;
      border: none;
      font-weight: 600;
      padding: 0 20px;
      border-radius: 8px;
      cursor: pointer;
    }
    .btn-send:hover { background-color: var(--primary-hover); color: white; }

    .tag-prolog {
      color: #38bdf8;
      font-family: monospace;
      font-size: 0.85rem;
    }
  </style>

  <!-- Tau-Prolog JS Engine -->
  <script src="js/tau-prolog.js"></script>
  <script src="js/lists.js"></script>
</head>
<body>

  <div class="chat-container">
    <header class="chat-header">
      <div>
        <h1>🎯 Sistema Experto de Marketing Digital <span class="badge">Tau-Prolog Core</span></h1>
        <p style="font-size: 0.8rem; color: var(--text-muted); margin-top: 2px;">
          Motor Atributo-Valor con Scoring de Incertidumbre y Auditoría "Why / How"
        </p>
      </div>
      <button class="btn-reset" onclick="iniciarSesion()">🔄 Reiniciar</button>
    </header>

    <main class="chat-messages" id="chatArea"></main>

    <footer class="chat-controls">
      <div class="quick-actions" id="quickActions"></div>
      <form class="input-form" onsubmit="event.preventDefault(); enviarTextoLibre();">
        <input type="text" id="userInput" placeholder="Selecciona una opción o escribe 'porque'..." autocomplete="off">
        <button type="submit" class="btn-send">Enviar</button>
      </form>
    </footer>
  </div>

  <script>
    // =========================================================================
    // BASE DE CONOCIMIENTO (PROLOG PARA TAU-PROLOG)
    // =========================================================================
    const CODIGO_PROLOG = `
:- dynamic(conocido/2).

regla(campanas_google_search_y_sem, [
    condicion(objetivo_principal, [ventas_directas]),
    condicion(presupuesto, [medio, alto]),
    condicion(publico_con_alta_intencion_compra, [si]),
    condicion(comportamiento_descubrimiento, [busqueda_racional])
]).

regla(publicidad_redes_sociales_meta_ads, [
    condicion(objetivo_principal, [visibilidad_marca, ventas_directas]),
    condicion(comportamiento_descubrimiento, [descubrimiento_visual]),
    condicion(audiencia_en_redes_sociales, [si])
]).

regla(marketing_de_contenidos_y_seo, [
    condicion(objetivo_principal, [posicionamiento_largo_plazo]),
    condicion(presupuesto, [bajo, medio]),
    condicion(capacidad_creacion_contenido, [si]),
    condicion(comportamiento_descubrimiento, [busqueda_racional])
]).

regla(email_marketing_y_fidelizacion, [
    condicion(objetivo_principal, [retencion_clientes]),
    condicion(posee_base_datos_clientes, [si]),
    condicion(producto_recompra_recurrente, [si])
]).

regla(marketing_de_influencers_microinfluencers, [
    condicion(objetivo_principal, [visibilidad_marca]),
    condicion(comportamiento_descubrimiento, [descubrimiento_visual]),
    condicion(presupuesto, [medio, alto]),
    condicion(audiencia_en_redes_sociales, [si])
]).

regla(inbound_marketing_y_lead_nurturing, [
    condicion(objetivo_principal, [ventas_directas, posicionamiento_largo_plazo]),
    condicion(ciclo_de_decision, [largo_evaluativo]),
    condicion(capacidad_creacion_contenido, [si])
]).
`;

    // =========================================================================
    // DICCIONARIOS DE PREGUNTAS Y ESTRATEGIAS
    // =========================================================================
    const DEFINICION_PREGUNTAS = {
      'presupuesto': {
        tipo: 'seleccion_unica',
        pregunta: '¿Cuál es el nivel de presupuesto para inversión publicitaria en esta campaña?',
        ayuda: 'Capacidad financiera destinada a pauta publicitaria.',
        opciones: [
          { id: 'alto', texto: 'Alto (inversión amplia)' },
          { id: 'medio', texto: 'Medio (inversión moderada)' },
          { id: 'bajo', texto: 'Bajo (inversión mínima)' }
        ]
      },
      'objetivo_principal': {
        tipo: 'seleccion_unica',
        pregunta: '¿Cuál es el objetivo principal de esta campaña de marketing?',
        ayuda: 'Meta estratégica prioritaria del negocio.',
        opciones: [
          { id: 'ventas_directas', texto: 'Generar conversiones directas' },
          { id: 'visibilidad_marca', texto: 'Aumentar el reconocimiento de marca' },
          { id: 'posicionamiento_largo_plazo', texto: 'Posicionamiento orgánico en buscadores' },
          { id: 'retencion_clientes', texto: 'Fidelizar a los clientes existentes' }
        ]
      },
      'ciclo_de_decision': {
        tipo: 'seleccion_unica',
        pregunta: '¿Cómo se caracteriza el proceso de decisión de compra del cliente objetivo?',
        ayuda: 'Tiempo y esfuerzo cognitivo requerido antes de la compra.',
        opciones: [
          { id: 'corto_impulso', texto: 'Decisión rápida (compra inmediata)' },
          { id: 'largo_evaluativo', texto: 'Decisión evaluativa (requiere análisis previo)' }
        ]
      },
      'comportamiento_descubrimiento': {
        tipo: 'seleccion_unica',
        pregunta: '¿Cómo decide el cliente habitual la compra de esta oferta?',
        ayuda: 'Estímulo que detona el interés de compra.',
        opciones: [
          { id: 'descubrimiento_visual', texto: 'Por atracción visual (demostración)' },
          { id: 'busqueda_racional', texto: 'Por búsqueda activa (investigación)' }
        ]
      },
      'publico_con_alta_intencion_compra': {
        tipo: 'booleana',
        pregunta: '¿El público objetivo busca activamente una solución en internet ante la necesidad?',
        ayuda: 'Existencia de demanda previa en canales de búsqueda.',
        opciones: [
          { id: 'si', texto: 'Sí' },
          { id: 'no', texto: 'No' }
        ]
      },
      'audiencia_en_redes_sociales': {
        tipo: 'booleana',
        pregunta: '¿El perfil de cliente habitual utiliza redes sociales cotidianamente?',
        ayuda: 'Presencia habitual del cliente en plataformas sociales.',
        opciones: [
          { id: 'si', texto: 'Sí' },
          { id: 'no', texto: 'No' }
        ]
      },
      'capacidad_creacion_contenido': {
        tipo: 'booleana',
        pregunta: '¿La organización dispone de recursos humanos para la creacion de contenidos?',
        ayuda: 'Disponibilidad de equipo para generar piezas informativas.',
        opciones: [
          { id: 'si', texto: 'Sí' },
          { id: 'no', texto: 'No' }
        ]
      },
      'posee_base_datos_clientes': {
        tipo: 'booleana',
        pregunta: '¿La empresa cuenta con un registro estructurado de contactos de posibles clientes?',
        ayuda: 'Disponibilidad de correos o números para contacto directo.',
        opciones: [
          { id: 'si', texto: 'Sí' },
          { id: 'no', texto: 'No' }
        ]
      },
      'producto_recompra_recurrente': {
        tipo: 'booleana',
        pregunta: '¿El modelo comercial contempla compras repetidas?',
        ayuda: 'Generación de ingresos recurrentes por cliente.',
        opciones: [
          { id: 'si', texto: 'Sí' },
          { id: 'no', texto: 'No' }
        ]
      }
    };

    const ESTRATEGIAS = [
      { id: 'campanas_google_search_y_sem', nombre: 'Google Ads (Búsqueda / SEM)' },
      { id: 'publicidad_redes_sociales_meta_ads', nombre: 'Social Ads (Meta / Instagram & Facebook)' },
      { id: 'marketing_de_contenidos_y_seo', nombre: 'SEO Orgánico y Marketing de Contenidos' },
      { id: 'email_marketing_y_fidelizacion', nombre: 'Email Marketing y Fidelización' },
      { id: 'marketing_de_influencers_microinfluencers', nombre: 'Marketing con Micro-Influencers' },
      { id: 'inbound_marketing_y_lead_nurturing', nombre: 'Inbound Marketing y Leads' }
    ];

    const REGLAS_ESTRATEGIAS = {
      'campanas_google_search_y_sem': [
        { atributo: 'objetivo_principal', permitidos: ['ventas_directas'] },
        { atributo: 'presupuesto', permitidos: ['medio', 'alto'] },
        { atributo: 'publico_con_alta_intencion_compra', permitidos: ['si'] },
        { atributo: 'comportamiento_descubrimiento', permitidos: ['busqueda_racional'] }
      ],
      'publicidad_redes_sociales_meta_ads': [
        { atributo: 'objetivo_principal', permitidos: ['visibilidad_marca', 'ventas_directas'] },
        { atributo: 'comportamiento_descubrimiento', permitidos: ['descubrimiento_visual'] },
        { atributo: 'audiencia_en_redes_sociales', permitidos: ['si'] }
      ],
      'marketing_de_contenidos_y_seo': [
        { atributo: 'objetivo_principal', permitidos: ['posicionamiento_largo_plazo'] },
        { atributo: 'presupuesto', permitidos: ['bajo', 'medio'] },
        { atributo: 'capacidad_creacion_contenido', permitidos: ['si'] },
        { atributo: 'comportamiento_descubrimiento', permitidos: ['busqueda_racional'] }
      ],
      'email_marketing_y_fidelizacion': [
        { atributo: 'objetivo_principal', permitidos: ['retencion_clientes'] },
        { atributo: 'posee_base_datos_clientes', permitidos: ['si'] },
        { atributo: 'producto_recompra_recurrente', permitidos: ['si'] }
      ],
      'marketing_de_influencers_microinfluencers': [
        { atributo: 'objetivo_principal', permitidos: ['visibilidad_marca'] },
        { atributo: 'comportamiento_descubrimiento', permitidos: ['descubrimiento_visual'] },
        { atributo: 'presupuesto', permitidos: ['medio', 'alto'] },
        { atributo: 'audiencia_en_redes_sociales', permitidos: ['si'] }
      ],
      'inbound_marketing_y_lead_nurturing': [
        { atributo: 'objetivo_principal', permitidos: ['ventas_directas', 'posicionamiento_largo_plazo'] },
        { atributo: 'ciclo_de_decision', permitidos: ['largo_evaluativo'] },
        { atributo: 'capacidad_creacion_contenido', permitidos: ['si'] }
      ]
    };

    const DESCRIPCIONES = {
      'campanas_google_search_y_sem': {
        nombre: 'Google Ads (Búsqueda / SEM)',
        accion: '<b>Qué hacer:</b> Configura anuncios orientados a términos exactos de compra (ej. "comprar [producto]") y dirige a los usuarios a una página de aterrizaje clara con llamada a la acción directa.'
      },
      'publicidad_redes_sociales_meta_ads': {
        nombre: 'Social Ads (Meta / Instagram & Facebook)',
        accion: '<b>Qué hacer:</b> Diseña anuncios en video e imágenes mostrando tu producto en acción, segmenta tu audiencia por intereses y lanza promociones directas con enlace a tu tienda o WhatsApp.'
      },
      'marketing_de_contenidos_y_seo': {
        nombre: 'SEO Orgánico y Marketing de Contenidos',
        accion: '<b>Qué hacer:</b> Publica artículos o videos resolviendo las dudas más habituales de tus clientes, optimiza los títulos con palabras clave de búsqueda y atrae tráfico orgánico continuo sin costo de pauta.'
      },
      'email_marketing_y_fidelizacion': {
        nombre: 'Email Marketing y Fidelización',
        accion: '<b>Qué hacer:</b> Envía a tus contactos de clientes una publicidad, novedad o promoción exclusiva sobre tu producto para incentivar compras repetidas y reactivar clientes inactivos.'
      },
      'marketing_de_influencers_microinfluencers': {
        nombre: 'Marketing con Micro-Influencers de Nicho',
        accion: '<b>Qué hacer:</b> Contacta a 5-10 creadores de contenido de tu sector, envíales muestras de tu producto y pídeles reseñas auténticas y demostraciones en video para generar confianza rápida.'
      },
      'inbound_marketing_y_lead_nurturing': {
        nombre: 'Inbound Marketing y Nutrición de Leads',
        accion: '<b>Qué hacer:</b> Diseña un recurso descargable gratuito (guía, plantilla o caso de estudio) para captar correos de prospectos y envíales una secuencia automatizada de valor antes de ofertarles.'
      }
    };

    // =========================================================================
    // ESTADO DEL CLIENTE Y MOTOR PROLOG
    // =========================================================================
    let session = null;
    let condicionesConocidas = {}; // atributo -> valor registrado
    let hipotesisActual = null;
    let atributoActual = null;
    let condicionActualObj = null;
    let evaluacionFinalizada = false;

    function iniciarSesion() {
      condicionesConocidas = {};
      hipotesisActual = null;
      atributoActual = null;
      condicionActualObj = null;
      evaluacionFinalizada = false;

      const chatArea = document.getElementById("chatArea");
      chatArea.innerHTML = "";
      document.getElementById("quickActions").style.display = "flex";

      session = pl.create();
      session.consult(CODIGO_PROLOG, {
        success: function() {
          agregarMensajeBot(`👋 ¡Hola! Soy tu <b>Asistente Experto en Marketing Digital</b>.<br><br>
            Determinaré la mejor estrategia para tu empresa evaluando las hipótesis en tiempo real con el modelo <b>Atributo-Valor</b>.<br>
            <ul>
              <li>Puedes hacer clic en los botones de opción o escribir en el campo de texto.</li>
              <li>Pulsa <b>❓ ¿Por qué?</b> en cualquier momento para saber qué hipótesis está evaluando el sistema.</li>
            </ul>`);
          siguientePasoInferencia();
        },
        error: function(err) {
          agregarMensajeBot(`❌ Error cargando Tau-Prolog: ${err}`);
        }
      });
    }

    function siguientePasoInferencia() {
      if (evaluacionFinalizada) return;

      // Buscar el siguiente atributo no conocido
      for (const est of ESTRATEGIAS) {
        const condiciones = REGLAS_ESTRATEGIAS[est.id];
        for (const cond of condiciones) {
          if (condicionesConocidas[cond.atributo] === undefined) {
            hipotesisActual = est;
            atributoActual = cond.atributo;
            condicionActualObj = cond;

            const def = DEFINICION_PREGUNTAS[atributoActual];
            const textoPregunta = def ? def.pregunta : `¿Cuál es el valor para ${atributoActual}?`;

            agregarMensajeBot(textoPregunta);
            actualizarBotonesAccion(def);
            return;
          }
        }
      }

      finalizarEvaluacion();
    }

    function actualizarBotonesAccion(def) {
      const quickActions = document.getElementById("quickActions");
      quickActions.innerHTML = "";

      if (!def) return;

      if (def.tipo === 'booleana') {
        const btnSi = document.createElement("button");
        btnSi.className = "btn-action btn-yes";
        btnSi.innerHTML = "👍 Sí";
        btnSi.onclick = () => enviarRespuesta('si', 'Sí');

        const btnNo = document.createElement("button");
        btnNo.className = "btn-action btn-no";
        btnNo.innerHTML = "👎 No";
        btnNo.onclick = () => enviarRespuesta('no', 'No');

        quickActions.appendChild(btnSi);
        quickActions.appendChild(btnNo);
      } else {
        def.opciones.forEach(opt => {
          const btn = document.createElement("button");
          btn.className = "btn-action btn-opt";
          btn.textContent = opt.texto;
          btn.onclick = () => enviarRespuesta(opt.id, opt.texto);
          quickActions.appendChild(btn);
        });
      }

      const btnWhy = document.createElement("button");
      btnWhy.className = "btn-action btn-why";
      btnWhy.innerHTML = "❓ ¿Por qué?";
      btnWhy.onclick = () => enviarRespuesta('porque', '¿Por qué me preguntas esto?');
      quickActions.appendChild(btnWhy);
    }

    function responderAtributo(valorId) {
      if (evaluacionFinalizada || !atributoActual) return;

      condicionesConocidas[atributoActual] = valorId;

      session.query(`assertz(conocido(${atributoActual}, ${valorId})).`, {
        success: function() {
          session.answer({
            success: function() {
              atributoActual = null;
              condicionActualObj = null;
              siguientePasoInferencia();
            }
          });
        }
      });
    }

    function mostrarExplicacionWhy() {
      if (!hipotesisActual || !condicionActualObj) return;

      const def = DEFINICION_PREGUNTAS[condicionActualObj.atributo];
      const htmlWhy = `
        <div style="font-weight: 600; margin-bottom: 4px;">🔍 Justificación "Why":</div>
        Estoy evaluando la viabilidad de la estrategia: <b>"${hipotesisActual.nombre}"</b>.<br>
        Para validar esta hipótesis, requiero conocer el parámetro: <b>${condicionActualObj.atributo}</b>.<br>
        <i>${def ? def.ayuda : ''}</i><br>
        Los valores que favorecen esta recomendación son: <span class="tag-prolog">[${condicionActualObj.permitidos.join(', ')}]</span>.
      `;
      agregarMensajeWhy(htmlWhy);
    }

    function finalizarEvaluacion() {
      evaluacionFinalizada = true;
      document.getElementById("quickActions").style.display = "none";

      const ranking = [];

      for (const est of ESTRATEGIAS) {
        const condiciones = REGLAS_ESTRATEGIAS[est.id];
        const cumplidas = [];
        const noCumplidas = [];

        condiciones.forEach(c => {
          const valorActual = condicionesConocidas[c.atributo];
          const cumple = c.permitidos.includes(valorActual);
          const detalle = {
            atributo: c.atributo,
            valorActual: valorActual,
            permitidos: c.permitidos
          };

          if (cumple) {
            cumplidas.push(detalle);
          } else {
            noCumplidas.push(detalle);
          }
        });

        const score = Math.round((cumplidas.length / condiciones.length) * 100);
        ranking.push({
          id: est.id,
          nombre: DESCRIPCIONES[est.id].nombre,
          accion: DESCRIPCIONES[est.id].accion,
          score: score,
          cumplidas: cumplidas,
          noCumplidas: noCumplidas
        });
      }

      ranking.sort((a, b) => b.score - a.score);

      const ganadora = ranking[0];
      const alternativas = ranking.slice(1).filter(r => r.score >= 50);

      renderizarResultadoFinal(ganadora, alternativas, ranking);
    }

    function renderizarResultadoFinal(ganadora, alternativas, rankingCompleto) {
      if (!ganadora || ganadora.score === 0) {
        agregarMensajeBot(`
          <div class="msg-result" style="border-color: #ef4444; background-color: #450a0a;">
            <h2>❌ Sin recomendación viable</h2>
            <p>Todas las respuestas registradas resultaron incompatibles (0% de coincidencia). Te recomendamos replantear tus metas y presupuesto de marketing.</p>
          </div>
        `);
        return;
      }

      let alternativasHtml = "";
      if (alternativas.length > 0) {
        alternativasHtml = `
          <div style="margin-top: 14px; font-size: 0.9rem;">
            <b>Otras opciones viables:</b>
            <ul style="margin-left: 18px; margin-top: 4px;">
              ${alternativas.map(a => `<li>${a.nombre} <b>(${a.score}% afinidad)</b></li>`).join('')}
            </ul>
          </div>
        `;
      }

      let howHtml = "";
      rankingCompleto.filter(r => r.score > 0).forEach(r => {
        howHtml += `
          <div style="margin-top: 10px; padding: 8px 12px; background: rgba(0,0,0,0.25); border-radius: 8px;">
            <b>${r.nombre} (${r.score}% de coincidencia):</b>
            <ul class="how-list">
              ${r.cumplidas.map(c => `<li><span class="check">✓</span> <b>${c.atributo}:</b> "${c.valorActual}" coincide con [${c.permitidos.join(', ')}]</li>`).join('')}
              ${r.noCumplidas.map(c => `<li><span class="cross">✗</span> <b>${c.atributo}:</b> "${c.valorActual || 'no respondido'}" no coincide con [${c.permitidos.join(', ')}]</li>`).join('')}
            </ul>
          </div>
        `;
      });

      const resultadoHtml = `
        <div class="msg-result">
          <span class="score-pill">🏆 Recomendación Principal: ${ganadora.score}% Afinidad</span>
          <h2>${ganadora.nombre}</h2>
          <p style="color: #cbd5e1; margin-top: 4px;">${ganadora.accion}</p>

          ${alternativasHtml}

          <div class="how-section">
            <h4 style="color: #93c5fd; margin-bottom: 6px;">📜 Trazabilidad y Justificación Deductiva ("How"):</h4>
            ${howHtml}
          </div>
        </div>
      `;

      agregarMensajeBot(resultadoHtml);
    }

    function agregarMensajeBot(html) {
      const chatArea = document.getElementById("chatArea");
      const msg = document.createElement("div");
      msg.className = "msg msg-bot";
      msg.innerHTML = html;
      chatArea.appendChild(msg);
      chatArea.scrollTop = chatArea.scrollHeight;
    }

    function agregarMensajeUser(texto) {
      const chatArea = document.getElementById("chatArea");
      const msg = document.createElement("div");
      msg.className = "msg msg-user";
      msg.textContent = texto;
      chatArea.appendChild(msg);
      chatArea.scrollTop = chatArea.scrollHeight;
    }

    function agregarMensajeWhy(html) {
      const chatArea = document.getElementById("chatArea");
      const msg = document.createElement("div");
      msg.className = "msg msg-why";
      msg.innerHTML = html;
      chatArea.appendChild(msg);
      chatArea.scrollTop = chatArea.scrollHeight;
    }

    function enviarRespuesta(valorId, textoPresentar) {
      if (valorId === 'porque') {
        agregarMensajeUser("¿Por qué me preguntas esto?");
        mostrarExplicacionWhy();
      } else {
        agregarMensajeUser(textoPresentar || valorId);
        responderAtributo(valorId);
      }
    }

    function enviarTextoLibre() {
      const input = document.getElementById("userInput");
      const valor = input.value.trim().toLowerCase();
      input.value = "";
      if (!valor || !atributoActual) return;

      if (['porque', 'por que', 'por qué', 'porqué', 'why', 'w', '?'].includes(valor)) {
        enviarRespuesta('porque', '¿Por qué me preguntas esto?');
        return;
      }

      const def = DEFINICION_PREGUNTAS[atributoActual];
      if (!def) return;

      if (def.tipo === 'booleana') {
        if (['si', 's', 'yes', 'y', 'sí', '1'].includes(valor)) {
          enviarRespuesta('si', 'Sí');
        } else if (['no', 'n', '2', '0'].includes(valor)) {
          enviarRespuesta('no', 'No');
        } else {
          agregarMensajeBot('⚠️ Entrada no reconocida. Escribe <b>"si"</b>, <b>"no"</b> o <b>"porque"</b>.');
        }
      } else {
        // Verificar por número de opción (1, 2, ...)
        const num = parseInt(valor, 10);
        if (!isNaN(num) && num >= 1 && num <= def.opciones.length) {
          const opt = def.opciones[num - 1];
          enviarRespuesta(opt.id, opt.texto);
          return;
        }

        // Verificar por texto o id
        const opt = def.opciones.find(o => o.id === valor || o.texto.toLowerCase().includes(valor));
        if (opt) {
          enviarRespuesta(opt.id, opt.texto);
        } else {
          agregarMensajeBot(`⚠️ Opción no reconocida. Elige una opción válida o escribe el número (1 al ${def.opciones.length}).`);
        }
      }
    }

    window.addEventListener("DOMContentLoaded", iniciarSesion);
  </script>
